# cargo-deny policy: licenses, advisories, banned/duplicate crates, allowed sources.
# Run: cargo deny check   (CI: .github/workflows/audit.yml)

[graph]
all-features = false

[advisories]
# Unmaintained-crate advisories only count for our own direct dependencies (cargo-deny default), so
# RUSTSEC-2026-0374 (basic-toml, build-time via askama) needs no exception here; `cargo audit` has it.
ignore = []

[licenses]
# Permissive licenses only: a copyleft crate (GPL/AGPL/LGPL-only) must be a conscious decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Two versions of one crate happen when dependencies move at different speeds (rand, digest, ...):
# visible as a warning, not a failure.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
