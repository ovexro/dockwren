[package]
name = "dockwren"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Small self-hosted panel: one-click Docker Compose apps, snapshots, updates"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["form"] }
bollard = "0.21.1"
futures-util = "0.3.34"
rand = "0.10.3"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "0.9"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
