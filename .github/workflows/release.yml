name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - name: Test
        run: cargo test
      - name: Build static binary
        run: scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dockwren-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write       # sign the build provenance (sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dockwren-*-linux
      - name: Combine checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dockwren-x86_64-linux dockwren-aarch64-linux SHA256SUMS
