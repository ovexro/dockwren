<ul>
{% for a in apps %}
  <li><img class="app-icon" src="/apps/{{ a.id }}/icon.svg" alt="" width="32" height="32"> <strong>{{ a.name }}</strong> <span class="app-desc">{{ a.description }}</span>
    {% if a.https_note %}<em>(needs HTTPS to be usable remotely)</em>{% endif %}
    <button class="primary" hx-get="/apps/{{ a.id }}/new" hx-target="#install" hx-swap="innerHTML">Install</button></li>
{% endfor %}
</ul>
