<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dockwren</title>
  <link rel="stylesheet" href="/static/dockwren.css?v={{ assets }}">
  <script src="/static/htmx.min.js?v={{ assets }}" defer></script>
</head>
<body>
  <main>
    <h1>Dockwren</h1>
    <p>Version {{ version }}</p>
    <h2>Resources</h2>
    <div id="metrics" hx-get="/metrics" hx-trigger="load" hx-swap="outerHTML">Loading…</div>
    <h2>Apps</h2>
    <div id="apps" hx-get="/apps" hx-trigger="load" hx-swap="innerHTML">Loading…</div>
    <section id="install"></section>
    <h2>Installed apps</h2>
    <div id="instances" hx-get="/instances" hx-trigger="load, every 10s" hx-swap="innerHTML">Loading…</div>
    <h2>Containers</h2>
    <div id="containers" hx-get="/containers" hx-trigger="load, every 5s" hx-swap="innerHTML">Loading…</div>
    <section id="logs"></section>
    <form method="post" action="/logout"><button type="submit">Sign out</button></form>
  </main>
</body>
</html>
