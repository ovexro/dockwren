{% if let Some(msg) = error %}
<p role="alert">{{ msg }}</p>
{% else if containers.is_empty() %}
<p>No containers yet.</p>
{% else %}
<div class="clist">
  {% for c in containers %}
  <details class="crow" data-state="{{ c.state }}">
    <summary>
      <span class="cname" title="{{ c.name }}">{{ c.name }}</span>
      <span class="badge" data-state="{{ c.state }}">{{ c.state }}</span>
      <span class="cimg muted" title="{{ c.image }}">{{ c.image }}</span>
      <span class="cstatus muted">{{ c.status }}</span>
    </summary>
    <div class="cbody">
      <div class="cactions">
        <button hx-get="/containers/{{ c.id }}/logs" hx-target="#logs" hx-swap="innerHTML">Logs</button>
        {% if c.state == "running" %}
        <button hx-post="/containers/{{ c.id }}/restart" hx-target="#containers" hx-swap="innerHTML">Restart</button>
        <button hx-post="/containers/{{ c.id }}/stop" hx-target="#containers" hx-swap="innerHTML" hx-confirm="Stop {{ c.name }}?" class="danger">Stop</button>
        {% else %}
        <button hx-post="/containers/{{ c.id }}/start" hx-target="#containers" hx-swap="innerHTML">Start</button>
        {% endif %}
      </div>
      <div class="gslot" hx-get="/containers/{{ c.name }}/graphs" hx-trigger="toggle from:closest details once" hx-swap="innerHTML"><p class="muted">Loading…</p></div>
    </div>
  </details>
  {% endfor %}
</div>
{% endif %}
