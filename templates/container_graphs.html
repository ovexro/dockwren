<div class="graphs" hx-get="/containers/{{ name }}/graphs?range={{ range }}" hx-trigger="every 10s" hx-swap="outerHTML">
  <p class="muted ranges">
    {% for r in ranges %}{% if r.0 == range %}<strong>{{ r.1 }}</strong>{% else %}<a href="#" hx-get="/containers/{{ name }}/graphs?range={{ r.0 }}" hx-target="closest .graphs" hx-swap="outerHTML">{{ r.1 }}</a>{% endif %} {% endfor %}</p>
  <div class="charts">
    {% for c in charts %}
    <figure class="chart">
      <figcaption><strong>{{ c.title }}</strong><span title="{{ c.now }}">{{ c.now }}</span></figcaption>
      <svg viewBox="0 0 {{ w }} {{ h }}" preserveAspectRatio="none" role="img" aria-label="{{ name }} {{ c.title }}: {{ c.now }}">
        <line x1="0" y1="{{ h }}" x2="{{ w }}" y2="{{ h }}" class="axis"/>
        {% for l in c.lines %}<polyline points="{{ l.points }}" fill="none"/>{% endfor %}
      </svg>
      <small>{{ c.scale }}</small>
    </figure>
    {% endfor %}
  </div>
</div>
