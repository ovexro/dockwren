[app]
id = "actual-budget"
name = "Actual Budget"
description = "Personal budgeting with envelopes, local-first and private"
changelog = "https://github.com/actualbudget/actual/releases"
version = 1
note = "Your budget. Set a server password on first visit. It needs HTTPS (publish it with a hostname) when used from other devices."
accepts_public_host = true
needs_public_https = true

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "actual-budget"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[services]]
name = "actual"
main = true
health = { source = "panel", test = ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval = "15s", start_period = "20s" }

[backup]
paths = ["data"]

[update]
image_pins = ["actualbudget/actual-server"]
pre_update = ["backup"]
