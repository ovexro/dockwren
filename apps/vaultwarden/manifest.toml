[app]
id = "vaultwarden"
name = "Vaultwarden"
description = "Self-hosted password manager (Bitwarden compatible)"
version = 1
note = "Password manager (Bitwarden compatible). Browsers need HTTPS to use it away from this server, so give it a public hostname."
public_url_field = "PUBLIC_URL"
needs_public_https = true

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "vaultwarden"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "url"
default = "http://127.0.0.1:${WEB_PORT}/"

[[fields]]
key = "SIGNUPS_ALLOWED"
label = "Allow sign-ups"
type = "bool"
default = "true"
help = "Choose true to let anyone with the link create an account, or false to keep the app private. Choose false once your own account exists."

[[services]]
name = "vaultwarden"
main = true
health = { source = "image" }

[backup]
paths = ["data"]

[update]
image_pins = ["vaultwarden/server"]
pre_update = ["backup"]
