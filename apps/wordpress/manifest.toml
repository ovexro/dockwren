[app]
id = "wordpress"
name = "WordPress"
description = "Website and blog platform"
homepage = "https://wordpress.org/"
version = 1
note = "A complete site: database, passwords and keys are created for you. Enter a public hostname to get https://your-name with no port."
public_url_field = "SITE_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "wordpress"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "SITE_URL"
label = "Site address"
type = "string"
default = "http://127.0.0.1:${WEB_PORT}"
pattern = "^https?://[^/\\s]+$"
help = "The full web address of the site, for example https://blog.example.com, with nothing after the domain. Normally filled in for you from Public hostname."

[[fields]]
key = "ADMIN_USER"
label = "Admin user"
type = "string"
default = "admin"
pattern = "^[A-Za-z][A-Za-z0-9_-]{2,30}$"
help = "The username you will use to log in to WordPress."

[[fields]]
key = "ADMIN_PASSWORD"
label = "Admin password"
type = "password"
pattern = "^[^\\s'\"$]{12,64}$"
help = "Your WordPress password. At least 12 characters; no spaces, quotes or $ sign."

[[fields]]
key = "ADMIN_EMAIL"
label = "Admin e-mail"
type = "email"
help = "Your e-mail address. WordPress sends notices and password-reset messages here."

[[fields]]
key = "SITE_TITLE"
label = "Site title"
type = "string"
default = "My site"
pattern = "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,60}$"
help = "The name of your website, shown at the top of the page and in the browser tab. Not the same as Internal name. You can change it later in WordPress."

[[secrets]]
key = "DB_PASSWORD"
kind = "password"
length = 32

[[secrets]]
key = "DB_ROOT_PASSWORD"
kind = "password"
length = 32

[[secrets]]
key = "WP_KEY_1"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_2"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_3"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_4"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_5"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_6"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_7"
kind = "hex"
length = 64

[[secrets]]
key = "WP_KEY_8"
kind = "hex"
length = 64

[[services]]
name = "db"
health = { source = "image" }

[[services]]
name = "wordpress"
main = true
health = { source = "panel", test = ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"], interval = "10s", start_period = "30s" }

[[services]]
name = "wpcli"
health = { source = "panel", test = ["CMD", "wp", "--version"], interval = "30s", start_period = "10s" }

[[post_start]]
name = "install-site"
service = "wpcli"
run = ["wp", "core", "install", "--url=${SITE_URL}", "--title=${SITE_TITLE}", "--admin_user=${ADMIN_USER}", "--admin_password=${ADMIN_PASSWORD}", "--admin_email=${ADMIN_EMAIL}", "--skip-email"]

[backup]
paths = ["wp"]
[[backup.dumps]]
service = "db"
run = ["sh", "-c", "mariadb-dump --single-transaction --add-drop-table -u root -p\"$MARIADB_ROOT_PASSWORD\" wordpress"]
restore = ["sh", "-c", "mariadb -u root -p\"$MARIADB_ROOT_PASSWORD\" wordpress"]
output = "db.sql"

[update]
image_pins = ["wordpress", "mariadb"]
pre_update = ["backup"]
pinned_major = ["mariadb"]
