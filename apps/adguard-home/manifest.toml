[app]
id = "adguard-home"
name = "AdGuard Home"
description = "Network-wide ad and tracker blocking: a DNS server for your whole home network"
homepage = "https://adguard.com/adguard-home/overview.html"
version = 1
note = "Becomes the DNS server of your network: point your router's DNS (or single devices) at this server's address. It opens port 53 to your network. In the first-run wizard keep the admin web interface on port 3000, otherwise Dockwren can no longer reach it. If port 53 is already in use (systemd-resolved), the install tells you; free it first."
needs_public_https = false
accepts_public_host = false

[[lan_ports]]
port = 53
protocol = "tcp"
label = "DNS"

[[lan_ports]]
port = 53
protocol = "udp"
label = "DNS"

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "adguard-home"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers. Lower-case letters, digits and hyphens, starting with a letter."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door the admin page uses on this server; it can only be reached from the server itself (or through Tailscale/SSH). Leave it on auto."

[[services]]
name = "adguard-home"
main = true
health = { source = "panel", test = ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/"], interval = "15s", start_period = "20s" }

[backup]
paths = ["conf", "work"]

[update]
image_pins = ["adguard/adguardhome"]
pre_update = ["backup"]
