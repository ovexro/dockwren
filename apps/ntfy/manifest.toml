[app]
id = "ntfy"
name = "ntfy"
description = "Self-hosted push notifications to your phone and desktop"
changelog = "https://github.com/binwiederhier/ntfy/releases"
version = 1
note = "Push notification server. Nobody can publish or read until you create a user: run docker exec -it <container> ntfy user add --role=admin <name>."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "ntfy"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "url"
default = "http://127.0.0.1:${WEB_PORT}/"

[[services]]
name = "ntfy"
main = true
health = { source = "panel", test = ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health"], interval = "15s", start_period = "10s" }

[backup]
paths = ["data"]

[update]
image_pins = ["binwiederhier/ntfy"]
pre_update = ["backup"]
