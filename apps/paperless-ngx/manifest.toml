[app]
id = "paperless-ngx"
name = "Paperless-ngx"
description = "Document archive with OCR and full-text search"
homepage = "https://docs.paperless-ngx.com/"
version = 1
note = "Scans and archives documents. First start takes about a minute. Drop files into the consume folder of the instance to import them."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "paperless"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "Only a label for this installation on your server (used for its folder and container names); visitors never see it. Short, lower-case, for example blog. You can run several copies of the same app by giving each its own name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "Port on this server only (127.0.0.1). Leave on auto; visitors never type it."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "string"
default = "http://127.0.0.1:${WEB_PORT}"
pattern = "^https?://[^/\\s]+$"
help = "Origin only, no trailing slash or path (Paperless rejects a path)."

[[fields]]
key = "ADMIN_USER"
label = "Admin user"
type = "string"
default = "admin"
pattern = "^[a-z][a-z0-9_-]{2,30}$"
help = "Login name. The password is generated and shown once after install."

[[fields]]
key = "TIME_ZONE"
label = "Time zone"
type = "string"
default = "UTC"
pattern = "^[A-Za-z][A-Za-z0-9_/+-]{1,40}$"
help = "IANA name, for example Europe/Bucharest."

[[fields]]
key = "OCR_LANGUAGE"
label = "OCR language"
type = "string"
default = "eng"
pattern = "^[a-z]{3}(\\+[a-z]{3})*$"
help = "Tesseract codes joined with +, for example ron+eng."

[[secrets]]
key = "POSTGRES_PASSWORD"
kind = "password"
length = 32

[[secrets]]
key = "SECRET_KEY"
kind = "hex"
length = 64

[[secrets]]
key = "ADMIN_PASSWORD"
kind = "password"
length = 20
reveal = true

[[services]]
name = "broker"
health = { source = "image" }

[[services]]
name = "db"
health = { source = "image" }

[[services]]
name = "paperless"
main = true
health = { source = "image" }

[backup]
paths = ["data", "media"]
[[backup.dumps]]
service = "db"
run = ["pg_dump", "--clean", "--if-exists", "-U", "paperless", "paperless"]
restore = ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-U", "paperless", "paperless"]
output = "db.sql"

[update]
image_pins = ["ghcr.io/paperless-ngx/paperless-ngx", "postgres"]
pre_update = ["backup"]
pinned_major = ["postgres"]
