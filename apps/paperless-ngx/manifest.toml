[app]
id = "paperless-ngx"
name = "Paperless-ngx"
description = "Document archive with OCR and full-text search"
homepage = "https://docs.paperless-ngx.com/"
version = 1
note = "Scans and archives documents. First start takes about a minute. Drop files into the consume folder of the instance to import them."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "paperless"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "string"
default = "http://127.0.0.1:${WEB_PORT}"
pattern = "^https?://[^/\\s]+$"
help = "The full web address of the app, for example https://docs.example.com, with nothing after the domain. Normally filled in for you from Public hostname."

[[fields]]
key = "ADMIN_USER"
label = "Admin user"
type = "string"
default = "admin"
pattern = "^[a-z][a-z0-9_-]{2,30}$"
help = "The username you will sign in with. Dockwren creates a strong password for you and shows it once after the install, so copy it then."

[[fields]]
key = "TIME_ZONE"
label = "Time zone"
type = "string"
default = "UTC"
pattern = "^[A-Za-z][A-Za-z0-9_/+-]{1,40}$"
help = "Your region, so dates and times are right. For example Europe/Bucharest."

[[fields]]
key = "OCR_LANGUAGE"
label = "OCR language"
type = "string"
default = "eng"
pattern = "^[a-z]{3}(\\+[a-z]{3})*$"
help = "The language of your documents, so text can be read from scans. Use three-letter codes joined with +, for example ron+eng for Romanian and English."

[[secrets]]
key = "POSTGRES_PASSWORD"
kind = "password"
length = 32

[[secrets]]
key = "SECRET_KEY"
kind = "hex"
length = 64

[[secrets]]
key = "ADMIN_PASSWORD"
kind = "password"
length = 20
reveal = true

[[services]]
name = "broker"
health = { source = "image" }

[[services]]
name = "db"
health = { source = "image" }

[[services]]
name = "paperless"
main = true
health = { source = "image" }

[backup]
paths = ["data", "media"]
[[backup.dumps]]
service = "db"
run = ["pg_dump", "--clean", "--if-exists", "-U", "paperless", "paperless"]
restore = ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-U", "paperless", "paperless"]
output = "db.sql"

[update]
image_pins = ["ghcr.io/paperless-ngx/paperless-ngx", "postgres"]
pre_update = ["backup"]
pinned_major = ["postgres"]
