[app]
id = "seafile"
name = "Seafile"
description = "Fast file sync and sharing with desktop and phone apps, libraries and camera upload"
homepage = "https://www.seafile.com/"
changelog = "https://manual.seafile.com/13.0/changelog/server-changelog/"
version = 1
note = "Files are stored as blocks, not as a plain folder tree, so browse them in the web page or the Seafile apps. First start takes a few minutes while the databases are prepared. Sign in with the admin email and the password shown once after the install. The address you give here is written into Seafile's own settings on the first start, so choose the final one now. To keep the files on another disk, stop the app, move the data folder there and leave a symlink named data in the instance folder; Dockwren backups then hold the databases only, so back that disk up separately."
public_url_field = "PUBLIC_URL"
needs_public_https = true

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "seafile"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers. It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "string"
default = "http://127.0.0.1:${WEB_PORT}"
pattern = "^https?://[^/\\s]+$"
help = "The full web address of Seafile, for example https://files.example.com, with nothing after the domain. Normally filled in for you from Public hostname. Seafile stores it on the first start."

[[fields]]
key = "ADMIN_EMAIL"
label = "Admin email"
type = "email"
help = "The address you will sign in with. Dockwren creates a strong password for you and shows it once after the install, so copy it then."

[[fields]]
key = "TIME_ZONE"
label = "Time zone"
type = "string"
default = "Etc/UTC"
pattern = "^[A-Za-z][A-Za-z0-9_+/-]{1,40}$"
help = "A time zone name such as Europe/Bucharest. Used for the times Seafile shows."

[[secrets]]
key = "DB_ROOT_PASSWORD"
kind = "hex"
length = 32

[[secrets]]
key = "DB_PASSWORD"
kind = "hex"
length = 32

[[secrets]]
key = "REDIS_PASSWORD"
kind = "hex"
length = 32

[[secrets]]
key = "JWT_PRIVATE_KEY"
kind = "hex"
length = 40

[[secrets]]
key = "ADMIN_PASSWORD"
kind = "password"
length = 20
reveal = true

[[services]]
name = "db"
health = { source = "image" }

[[services]]
name = "redis"
health = { source = "image" }

[[services]]
name = "seafile"
main = true
health = { source = "panel", test = ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/"], interval = "20s", start_period = "120s" }

[backup]
paths = ["data"]
[[backup.dumps]]
service = "db"
run = ["sh", "-c", "mariadb-dump --single-transaction --databases ccnet_db seafile_db seahub_db -u root -p\"$MARIADB_ROOT_PASSWORD\""]
restore = ["sh", "-c", "mariadb -u root -p\"$MARIADB_ROOT_PASSWORD\" -e \"CREATE USER IF NOT EXISTS 'seafile'@'%' IDENTIFIED BY '$MARIADB_PASSWORD'; GRANT ALL PRIVILEGES ON ccnet_db.* TO 'seafile'@'%'; GRANT ALL PRIVILEGES ON seafile_db.* TO 'seafile'@'%'; GRANT ALL PRIVILEGES ON seahub_db.* TO 'seafile'@'%'\" && mariadb -u root -p\"$MARIADB_ROOT_PASSWORD\""]
output = "db.sql"

[update]
image_pins = ["seafileltd/seafile-mc", "redis"]
pre_update = ["backup"]
pinned_major = ["mariadb"]
