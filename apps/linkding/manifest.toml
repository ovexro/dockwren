[app]
id = "linkding"
name = "Linkding"
description = "Self-hosted bookmark manager, fast and minimal"
changelog = "https://github.com/sissbruecker/linkding/releases"
version = 1
note = "Your bookmarks, with tags and search. The admin password is generated and shown once."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "linkding"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "url"
default = "http://127.0.0.1:${WEB_PORT}"
help = "The address people use to reach this app. Leave it as it is for now: when you publish the app with a public hostname, Dockwren fills this in for you."

[[fields]]
key = "ADMIN_USER"
label = "Admin user"
type = "string"
default = "admin"
pattern = "^[a-z][a-z0-9_-]{2,30}$"
help = "The username you will sign in with. Dockwren creates a strong password for you and shows it once after the install, so copy it then."

[[secrets]]
key = "ADMIN_PASSWORD"
kind = "password"
length = 20
reveal = true

[[services]]
name = "linkding"
main = true
health = { source = "image" }

[backup]
paths = ["data"]

[update]
image_pins = ["sissbruecker/linkding"]
pre_update = ["backup"]
