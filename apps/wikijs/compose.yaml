services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wiki
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
  wikijs:
    image: ghcr.io/requarks/wiki:3.3.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: wiki
      DB_SSL: "false"
      ADMIN_PASS: ${ADMIN_PASS}
    volumes:
      - ./data:/wiki/data
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
