services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planka
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planka -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5
  planka:
    image: ghcr.io/plankanban/planka:2.3.1
    restart: unless-stopped
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: ${PUBLIC_URL}
      DATABASE_URL: postgresql://planka:${POSTGRES_PASSWORD}@db/planka
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_ADMIN_EMAIL: ${ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEFAULT_ADMIN_NAME: ${ADMIN_USER}
      DEFAULT_ADMIN_USERNAME: ${ADMIN_USER}
      TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${WEB_PORT}:1337"
