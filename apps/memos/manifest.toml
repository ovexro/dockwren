[app]
id = "memos"
name = "Memos"
description = "Self-hosted notes and micro-blogging, Markdown first"
version = 1
note = "Quick notes. Create your account on first visit; the first one becomes the owner."
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "memos"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "Only a label for this installation on your server (used for its folder and container names); visitors never see it. Short, lower-case, for example blog. You can run several copies of the same app by giving each its own name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "Port on this server only (127.0.0.1). Leave on auto; visitors never type it."

[[services]]
name = "memos"
main = true
health = { source = "panel", test = ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5230/healthz"], interval = "15s", start_period = "20s" }

[backup]
paths = ["data"]

[update]
image_pins = ["neosmemo/memos"]
pre_update = ["backup"]
