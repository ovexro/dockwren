[app]
id = "jellyfin"
name = "Jellyfin"
description = "Media server for your movies, shows, music and photos"
homepage = "https://jellyfin.org/"
version = 1
note = "Streams your own media library. On first visit a short wizard creates the admin account; add your library from the folder /media."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "jellyfin"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers. It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "string"
default = "http://127.0.0.1:${WEB_PORT}"
pattern = "^https?://[^/\\s]+$"
help = "The full web address of the app, for example https://media.example.com, with nothing after the domain. Normally filled in for you from Public hostname."

[[fields]]
key = "MEDIA_PATH"
label = "Media folder"
type = "string"
default = "/srv/media"
pattern = "^/[A-Za-z0-9._/-]+$"
help = "The folder on this server that holds your movies, shows and music. It is shown inside Jellyfin as /media and is read-only, so Jellyfin can never change your files. It is not backed up by Dockwren (only Jellyfin's own settings and library data are). Create it first if it does not exist."

[[fields]]
key = "TIME_ZONE"
label = "Time zone"
type = "string"
default = "UTC"
pattern = "^[A-Za-z][A-Za-z0-9_/+-]{1,40}$"
help = "Your region, so dates and times are right. For example Europe/Bucharest."

[[services]]
name = "jellyfin"
main = true
health = { source = "image" }

[backup]
paths = ["config"]

[update]
image_pins = ["jellyfin/jellyfin"]
pre_update = ["backup"]
