services:
  roundcube:
    image: roundcube/roundcubemail:1.7.7-apache
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DES_KEY: ${DES_KEY}
      ROUNDCUBEMAIL_DEFAULT_HOST: ${IMAP_SERVER}
      ROUNDCUBEMAIL_DEFAULT_PORT: ${IMAP_PORT}
      ROUNDCUBEMAIL_SMTP_SERVER: ${SMTP_SERVER}
      ROUNDCUBEMAIL_SMTP_PORT: ${SMTP_PORT}
      ROUNDCUBEMAIL_SKIN: elastic
    volumes:
      - ./db:/var/roundcube/db
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
