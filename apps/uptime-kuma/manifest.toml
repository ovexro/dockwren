[app]
id = "uptime-kuma"
name = "Uptime Kuma"
description = "Self-hosted uptime monitoring with status pages and alerts"
version = 1
note = "Monitors sites and services. Create the admin account on first visit."
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "uptime-kuma"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "Only a label for this installation on your server (used for its folder and container names); visitors never see it. Short, lower-case, for example blog. You can run several copies of the same app by giving each its own name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "Port on this server only (127.0.0.1). Leave on auto; visitors never type it."

[[services]]
name = "uptime-kuma"
main = true
health = { source = "image" }

[backup]
paths = ["data"]

[update]
image_pins = ["louislam/uptime-kuma"]
pre_update = ["backup"]
