[app]
id = "open-webui"
name = "Open WebUI"
description = "Self-hosted chat interface for AI models (OpenAI-compatible APIs, Ollama)"
changelog = "https://github.com/open-webui/open-webui/releases"
version = 1
note = "Chat UI for AI models. The first account you create on first visit becomes the admin; then add your provider (an API key or an Ollama address) under Admin settings. The image is large (several GB)."
public_url_field = "PUBLIC_URL"
needs_public_https = false

[[fields]]
key = "INSTANCE_NAME"
label = "Internal name"
type = "string"
default = "open-webui"
pattern = "^[a-z][a-z0-9-]{1,30}$"
help = "A short label for this installation, used only on your server: it names the folder and the Docker containers (for example dockwren-<name>-...). It is NOT part of your website address and visitors never see it. Lower-case letters, digits and hyphens, starting with a letter. To run a second copy of the same app, give it a different name."

[[fields]]
key = "WEB_PORT"
label = "Web port"
type = "port"
default = "auto"
help = "The door this app uses on this server; it can only be reached from the server itself. Leave it on auto and Dockwren picks a free one. Visitors never type it: they use your public hostname."

[[fields]]
key = "PUBLIC_URL"
label = "Public URL"
type = "url"
default = "http://127.0.0.1:${WEB_PORT}/"

[[secrets]]
key = "WEBUI_SECRET_KEY"
kind = "hex"
length = 48

[[services]]
name = "open-webui"
main = true
health = { source = "image" }

[backup]
paths = ["data"]

[update]
image_pins = ["ghcr.io/open-webui/open-webui"]
pre_update = ["backup"]
