services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linkwarden
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkwarden"]
      interval: 10s
      timeout: 5s
      retries: 5
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.17.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://linkwarden:${POSTGRES_PASSWORD}@db:5432/linkwarden
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${PUBLIC_URL}/api/v1/auth
      NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    volumes:
      - ./data:/data/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/v1/config >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
